name: in-sample study
# Manual only. Downloads data, seals the holdout, runs bias checks and all backtests,
# scores the gates, and commits the results. Never touches the sealed holdout.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: study
  cancel-in-progress: false
jobs:
  insample:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Refuse to run if in-sample results already exist
        run: test ! -f results/insample.json
      - name: Tests (including pre-registration lock)
        run: python -m pytest -q
      - name: Kraken market snapshot
        run: python -m study.markets
      - name: Download data, seal holdout, write manifest
        run: python -m study.data
      - name: Look-ahead checks
        run: python -m study.cli bias
      - name: Backtests (18 configs x 3 fee scenarios x 2 universes)
        run: python -m study.cli backtest
      - name: Score the gates
        run: python -m study.cli evaluate
      - name: Keep data and logs for the holdout run (90 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-data
          path: |
            user_data/data/
            runs/
            data/
            results/
          retention-days: 90
      - name: Commit manifest, market snapshot and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/markets_kraken.json results/
          git commit -m "In-sample results (run ${{ github.run_id }})"
          git push
