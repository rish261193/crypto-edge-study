name: holdout (run once)
# Scores the sealed final year for configurations that passed in-sample. Run once,
# after results/insample.json is committed, using the data from that same run.
on:
  workflow_dispatch:
    inputs:
      study_run_id:
        description: "Run ID of the in-sample study workflow whose data to use"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Require committed in-sample results; refuse a second holdout run
        run: test -f results/insample.json && test ! -f results/holdout.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: study-data
          run-id: ${{ inputs.study_run_id }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Restore data and in-sample runs; check the manifest matches
        run: |
          cmp artifact/data/manifest.json data/manifest.json
          mkdir -p user_data && cp -r artifact/user_data/data user_data/data && cp -r artifact/runs runs
      - name: Score the holdout
        run: python -m study.cli holdout
      - name: Commit holdout results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/holdout.json
          git commit -m "Holdout results (data from run ${{ inputs.study_run_id }})"
          git push
